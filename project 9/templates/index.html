<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Calling & Grounding Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 Live Search Research Agent</h1>
            <p>Ask real-time questions (current news, sports results, stock events) with live web grounding.</p>
        </header>

        <main>
            <!-- Query Form -->
            <form id="search-form" onsubmit="handleSearch(event)">
                <div class="input-group">
                    <input type="text" id="user-query" placeholder="e.g., What were the major technology news headlines today?" required autocomplete="off">
                    <button type="submit" id="submit-btn">Search</button>
                </div>
            </form>

            <!-- Loading Indicator -->
            <div id="loading" class="loading-box" style="display: none;">
                Fetching live web data and synthesizing answer...
            </div>

            <!-- Answer & Citations Card -->
            <div id="results-card" class="card" style="display: none;">
                <h2>Synthesized Answer</h2>
                <div id="answer-content" class="answer-box"></div>

                <hr>

                <h2>🔗 Sources & Citations</h2>
                <ul id="citations-list" class="citations-box"></ul>
            </div>
        </main>
    </div>

    <script>
        async function handleSearch(event) {
            event.preventDefault();

            const queryInput = document.getElementById('user-query');
            const submitBtn = document.getElementById('submit-btn');
            const loading = document.getElementById('loading');
            const resultsCard = document.getElementById('results-card');
            const answerContent = document.getElementById('answer-content');
            const citationsList = document.getElementById('citations-list');

            const query = queryInput.value.trim();
            if (!query) return;

            // Reset UI state
            resultsCard.style.display = 'none';
            loading.style.display = 'block';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.error) {
                    alert(data.error);
                    submitBtn.disabled = false;
                    return;
                }

                // Render Synthesized Answer
                answerContent.innerText = data.answer;

                // Render Clickable Citations
                citationsList.innerHTML = '';
                if (data.citations && data.citations.length > 0) {
                    data.citations.forEach((source, index) => {
                        const li = document.createElement('li');
                        li.innerHTML = `<strong>[${index + 1}]</strong> <a href="${source.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.title)}</a>`;
                        citationsList.appendChild(li);
                    });
                } else {
                    citationsList.innerHTML = '<li><em>No web chunk citations were returned for this query.</em></li>';
                }

                resultsCard.style.display = 'block';

            } catch (err) {
                loading.style.display = 'none';
                alert("An error occurred while connecting to the server.");
            }

            submitBtn.disabled = false;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
